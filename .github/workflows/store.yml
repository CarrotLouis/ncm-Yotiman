name: Store build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: store-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm test
      - name: Fetch pinned Yomitan release and matching source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path outputs -Force | Out-Null
          Invoke-WebRequest 'https://github.com/yomidevs/yomitan/releases/download/26.10.12.0/yomitan-chrome.zip' -OutFile outputs/yomitan-chrome.zip
          Invoke-WebRequest 'https://codeload.github.com/yomidevs/yomitan/tar.gz/e7334a96106a6c74e6fa75bd33a5ea1219d92712' -OutFile outputs/yomitan-source.tar.gz
      - name: Compile native host and retain notices
        shell: pwsh
        run: ./tools/build-yomitan.ps1 -YomitanArchive outputs/yomitan-chrome.zip
      - run: npm run check:store
      - run: npm run build
      - name: Prepare store directory and source archives
        run: node tools/prepare-store.cjs outputs/yomitan-chrome.zip outputs/yomitan-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ncm-yotiman-store
          path: |
            outputs/store/
            builds/*.plugin
          if-no-files-found: error
      - name: Publish compiled files for the plugin store
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: ./tools/publish-store.ps1
